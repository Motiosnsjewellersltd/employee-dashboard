name: Daily Jewellery Quiz notifications
on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-jewellery-quiz.yml'
      - 'lib/dailyQuiz*'
      - 'lib/quizActivity*'
      - 'app/api/daily-quiz/**'
permissions:
  id-token: write
concurrency:
  group: daily-jewellery-quiz-pilot
  cancel-in-progress: false
jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Wait for quiz deployment and check selected employee reminders
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          base = 'https://employee-dashboard-five-black.vercel.app'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + '/api/daily-quiz/health', timeout=15) as response:
                      if json.load(response).get('version') == 'daily-jewellery-quiz-reminders-v4':
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Quiz deployment is not ready. Re-run after Vercel deployment completes.')
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + urllib.parse.urlencode({'audience': 'motisons-daily-jewellery-quiz'})
          # A successful no-send scan is idle, not a reason to stop the scheduler.
          # Admin can publish/start another question, resume or change its gap later.
          # The API independently enforces dates, hours, audience and answer-stop.
          # Bound each runner to four hours; queued scheduled runs can take over.
          deadline = time.monotonic() + 4 * 60 * 60
          for tick in range(240):
              if time.monotonic() >= deadline:
                  break
              for retry in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          token = json.load(response)['value']
                      print('::add-mask::' + token, flush=True)
                      request = urllib.request.Request(base + '/api/daily-quiz/reminders', data=b'{}', method='POST', headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
                      with urllib.request.urlopen(request, timeout=80) as response:
                          result = json.load(response)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code == 429 or error.code >= 500:
                          if retry < 2:
                              time.sleep(5 * (retry + 1))
                              continue
                      details = {}
                      try:
                          body = json.load(error)
                          for name in ('code', 'claim'):
                              value = body.get(name)
                              if isinstance(value, str) and value.replace('_', '').isalnum() and len(value) <= 80:
                                  details[name] = value
                      except Exception:
                          pass
                      raise SystemExit('Quiz reminder HTTP ' + str(error.code) + '; diagnostics=' + json.dumps(details) + '; check Vercel logs.') from None
                  except (urllib.error.URLError, TimeoutError):
                      if retry < 2:
                          time.sleep(5 * (retry + 1))
                          continue
                      raise SystemExit('Quiz reminder network timeout; retries exhausted. Check the next workflow run.') from None
              if not result.get('ok'):
                  raise SystemExit('Quiz reminder check failed.')
              data = result['data']
              print(json.dumps(data), flush=True)
              if tick == 239:
                  break
              print('Reminder worker active; next check in up to 60 seconds.', flush=True)
              time.sleep(min(60, max(0, deadline - time.monotonic())))
          PYTHON
