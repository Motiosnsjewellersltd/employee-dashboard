name: Daily Jewellery Quiz pilot notifications
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-jewellery-quiz.yml'
      - 'lib/dailyQuiz*'
      - 'app/api/daily-quiz/**'
permissions:
  id-token: write
concurrency:
  group: daily-jewellery-quiz-pilot
  cancel-in-progress: false
jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for quiz deployment and check the test employee reminder
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request, urllib.parse, urllib.error
          base = 'https://employee-dashboard-five-black.vercel.app'
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + '/api/daily-quiz/health', timeout=15) as response:
                      if json.load(response).get('version') == 'daily-jewellery-quiz-pilot-v1':
                          break
              except Exception:
                  pass
              time.sleep(10)
          else:
              raise SystemExit('Quiz deployment is not ready. Re-run after Vercel deployment completes.')
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + urllib.parse.urlencode({'audience': 'motisons-daily-jewellery-quiz'})
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=20) as response:
              token = json.load(response)['value']
          print('::add-mask::' + token)
          request = urllib.request.Request(base + '/api/daily-quiz/reminders', data=b'{}', method='POST', headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=80) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit('Quiz reminder HTTP ' + str(error.code) + '; check Vercel logs. No token or response body is logged.') from None
          if not result.get('ok'):
              raise SystemExit('Quiz reminder check failed.')
          print(json.dumps(result['data']))
          PYTHON
